<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hemanth Kapa</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+Telugu:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'EB Garamond', serif;
            max-width: 480px;
            margin: 80px auto;
            padding: 0 20px;
            color: #1a1a1a;
            letter-spacing: 0.01em;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            transition: opacity 0.35s ease;
        }
        h1.is-fading {
            opacity: 0;
        }
        h1.telugu {
            font-family: 'Noto Serif Telugu', serif;
            font-weight: 500;
            letter-spacing: 0;
        }
        nav {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        nav a {
            color: #1a1a1a;
            text-decoration: none;
            font-size: 1.1rem;
            font-style: italic;
        }
        nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1 id="name">Hemanth Kapa</h1>
    <p>I mainly live in Carlisle, PA.</p>
    <nav>
        <a href="about.html">About</a>
        <a href="now.html">Now</a>
        <a href="writings/">Writings</a>
        <a href="reading.html">Reading</a>
        <a href="corners.html">Cool corners</a>
        <a href="photography.html">Photography</a>
        <a href="scrapbook.html">Scrapbook</a>
    </nav>
    <p><a href="mailto:kapahemanthsg@gmail.com">Reach out to me</a> · <a href="https://github.com/hemanthkapa" target="_blank">GitHub</a></p>
    <blockquote>"Rather than love, than money, than fame, give me truth." — Thoreau</blockquote>
    <script>
        (function () {
            var nameEl = document.getElementById('name');
            var english = 'Hemanth Kapa';
            var telugu = 'హేమంత్ కాపా';
            var showTelugu = false;

            setInterval(function () {
                nameEl.classList.add('is-fading');
                setTimeout(function () {
                    showTelugu = !showTelugu;
                    nameEl.textContent = showTelugu ? telugu : english;
                    nameEl.classList.toggle('telugu', showTelugu);
                    nameEl.classList.remove('is-fading');
                }, 350);
            }, 2000);
        })();
    </script>
</body>
</html>
